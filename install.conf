# install.conf — toggle which stow packages get installed.
#
# These flags are read by BOTH installers: the public install.sh (packages in
# config/) and the private install.sh (packages in private/config/). A flag
# named after a package therefore governs that package in whichever repo it
# lives.
#
# Each package directory has a STOW_<PKG> flag: the package name uppercased
# with non-alphanumeric chars turned into "_" (e.g. git -> STOW_GIT,
# tmuxinator -> STOW_TMUXINATOR). Set a flag to false to skip stowing that
# package. Any package without a flag here defaults to enabled.
#
# For per-machine choices that should NOT be committed, create
# install.conf.local next to this file (it is gitignored) and set flags there;
# it is loaded after this file and overrides it. Example, to keep a machine's
# own ~/.gitconfig instead of the one in this repo:
#
#     STOW_GIT=false
#
# Committed defaults (leave commented to keep everything enabled):
# STOW_GIT=true
