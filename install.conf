# install.conf — which config/ packages install.sh stows into ~ / ~/.config.
#
# One STOW_<PKG> flag per package: the folder name in config/, uppercased, with
# non-alphanumeric chars turned into "_" (e.g. tmuxinator -> STOW_TMUXINATOR).
# true = stow it, false = skip it. A package with no flag here is stowed.
#
# These are the defaults for every machine. To change them on one machine
# only, put overrides in install.conf.local next to this file (gitignored,
# loaded after this one). For example, to keep a work machine's own
# ~/.gitconfig:
#
#     STOW_GIT=false
#
# Setting a flag to false only stops future stowing; it doesn't remove links
# that already exist.

STOW_BTOP=true        # btop system monitor
STOW_FASTFETCH=true   # fastfetch system info + logo
STOW_GIT=true         # ~/.gitconfig
STOW_KARABINER=true   # Karabiner-Elements key remaps
STOW_NVIM=true        # Neovim
STOW_TMUX=true        # tmux + scripts
STOW_TMUXINATOR=true  # tmuxinator projects

